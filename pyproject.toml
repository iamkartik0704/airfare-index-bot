[project]
name = "safar-apix"
version = "0.4.0"
description = "SAFAR — Real-time Airfare Price Index (APIx) for India · SIH 26056 (MoSPI)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "sqlalchemy>=2.0.30",
    "alembic>=1.13",
    "psycopg[binary]>=3.2",
    "httpx>=0.27",
    "selectolax>=0.3.21",
    "pyyaml>=6.0",
    "structlog>=24.1",
    "prometheus-client>=0.20",
    "apscheduler>=3.10,<4",
    "tzdata>=2024.1",
]

[project.scripts]
safar = "packages.job_orchestration.cli:main"

[project.optional-dependencies]
browser = ["playwright>=1.45"]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "respx>=0.21",
    "ruff>=0.6",
    "mypy>=1.11",
    "types-PyYAML",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["packages", "apps"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-ra --strict-markers"
markers = [
    "postgres: requires a PostgreSQL database (SAFAR_TEST_DATABASE_URL)",
    "live: hits real websites; never run in CI",
]
filterwarnings = ["error::DeprecationWarning:packages.*", "error::DeprecationWarning:apps.*"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = [
    "node_modules", "src", "scraper", "docs", "apps/dashboard",
    # untracked one-off scaffolding scripts left at the repository root
    "generator.py", "fix_generator.py", "fix_adapters.py", "implement_ahead.py",
    "scaffold.py", "scaffold_v2.py", "update_adapters.py", "verify_tests.py",
    "test_*.py",
]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "BLE", "C4", "SIM", "RUF", "ASYNC", "PT"]
ignore = ["RUF001", "RUF002", "RUF003", "B008"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["BLE001"]

[tool.mypy]
python_version = "3.12"
packages = ["packages", "apps.api", "scripts"]
strict = true
warn_unused_ignores = true
plugins = ["pydantic.mypy"]
exclude = ["apps/dashboard", "infrastructure/db/migrations/versions"]

[[tool.mypy.overrides]]
module = ["playwright.*", "selectolax.*", "apscheduler.*", "respx.*"]
ignore_missing_imports = true
